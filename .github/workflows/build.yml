name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # Starter copy of the scam/phishing/malware list (the app refreshes it daily).
      - name: Bundle threat list
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/threats.txt \
            https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.mini-onlydomains.txt || true
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      # Rolling "latest" release (GitHub artifact storage is full).
      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk halo-guard.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest halo-guard.apk --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}" --target "$GITHUB_SHA" --prerelease
